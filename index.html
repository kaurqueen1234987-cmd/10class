
<!DOCTYPE html>
<html>
<head>
<title>Class 10 Registration</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(120deg,#74ebd5,#9face6);
    padding: 25px;
}

.container {
    max-width: 420px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 0 15px gray;
}

h2 {
    text-align: center;
    color: #5145a0;
}

input, select, textarea {
    width: 100%;
    padding: 11px;
    margin: 8px 0 15px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 6px;
}

button {
    width: 100%;
    padding: 13px;
    background: #5145a0;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 17px;
}

button:hover {
    background: #302477;
}

#message {
    text-align: center;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">

<h2>Class 10 Registration</h2>

<form id="studentForm">

<input id="name" placeholder="Student Name" required>

<input id="father" placeholder="Father's Name" required>

<input id="email" type="email" placeholder="Email ID" required>

<input id="phone" type="tel" placeholder="Phone Number"
pattern="[0-9]{10}" required>

<label>Date of Birth</label>
<input id="dob" type="date" required>

<select id="gender" required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<select id="studentClass" required>
<option value="">Select Class</option>
<option>10th</option>
</select>

<input id="school" placeholder="School Name" required>

<textarea id="address" placeholder="Address" required></textarea>

<button type="submit" id="submitBtn">
Submit Registration
</button>

</form>

<p id="message"></p>

</div>

<script type="module">

import {
 initializeApp
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
 getFirestore,
 collection,
 addDoc
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

import {
 getAuth,
 signInAnonymously
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";


// 1. FIREBASE CONFIGURATION

const firebaseConfig = {
 apiKey: "YOUR_API_KEY",
 authDomain: "YOUR_PROJECT.firebaseapp.com",
 projectId: "YOUR_PROJECT_ID",
 storageBucket: "YOUR_PROJECT.firebasestorage.app",
 messagingSenderId: "YOUR_SENDER_ID",
 appId: "YOUR_APP_ID"
};


// 2. INITIALIZE FIREBASE

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);


// 3. GOOGLE SHEET URL

const scriptURL = "YOUR_GOOGLE_SCRIPT_WEB_APP_URL";


// 4. FORM SUBMIT

document.getElementById("studentForm")
.addEventListener("submit", async function(e) {

 e.preventDefault();

 const btn = document.getElementById("submitBtn");
 const message = document.getElementById("message");

 btn.disabled = true;
 btn.innerText = "Submitting...";

 const student = {
   name: document.getElementById("name").value,
   father: document.getElementById("father").value,
   email: document.getElementById("email").value,
   phone: document.getElementById("phone").value,
   dob: document.getElementById("dob").value,
   gender: document.getElementById("gender").value,
   studentClass: document.getElementById("studentClass").value,
   school: document.getElementById("school").value,
   address: document.getElementById("address").value,
   createdAt: new Date().toISOString()
 };

 try {

   // FIREBASE AUTHENTICATION

   await signInAnonymously(auth);

   // SAVE DATA IN FIRESTORE

   await addDoc(collection(db, "students"), student);

   // SAVE DATA IN GOOGLE SHEETS

   const formData = new URLSearchParams(student);

   await fetch(scriptURL, {
     method: "POST",
     mode: "no-cors",
     body: formData
   });

   message.innerText =
   "Registration submitted! Firebase saved; Google Sheet request sent.";

   message.style.color = "green";

   document.getElementById("studentForm").reset();

 } catch(error) {

   console.error(error);

   message.innerText =
   "Error: " + error.message;

   message.style.color = "red";

 } finally {

   btn.disabled = false;
   btn.innerText = "Submit Registration";

 }

});

</script>

</body>
</html>
